# AIDCP 管理后台前端 — 每个 ECS target 本机部署一份。
# dev 当前可保留 8088 直连；ol 使用 aidcp.tommax.cc / aidcp.yytt.com.cn:80（不碰 isales）。
#
# Manual drop-in: copy to /etc/nginx/conf.d/aidcp-console.conf on the ECS box,
# then `nginx -t && nginx -s reload`. NOT covered by the aidcp-cloud rsync
# deploy (that only touches /opt/aidcp/cloud). Keep this file in sync with the
# live box copy by hand. Serves console static from /opt/aidcp/console and
# reverse-proxies /api + /ws to the same target's in-process panel layer on 127.0.0.1:8090.
# Do not point ol console at the dev panel API.
#
# Domains: aidcp.tommax.cc:80 added 2026-06-21; aidcp.yytt.com.cn:80 added
# 2026-07-21 as an alias for the same OL site. TLS remains at the external proxy;
# the ECS origin serves HTTP only.
server {
    listen 8088;
    listen 80;
    server_name aidcp.tommax.cc aidcp.yytt.com.cn;

    root /opt/aidcp/console;
    index index.html;

    # Facebook 发帖图片由前端以 Base64 JSON 逐张上传：单张原图上限 10 MiB，编码后需约 14 MiB。
    # 只放宽该上传路由，避免扩大普通面板 API 的请求体攻击面；cloud 侧仍保留 64 MiB 总请求上限。
    location ~ ^/api/accounts/[^/]+/facebook-publish-media/upload$ {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 面板 API（反代到进程内面板层 8090；绝不暴露 8787 边-云 ws）
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 面板事件流 WS（升级头）
    location /ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 对外客户登录门（edge 分发包 aidcpClientAuthUrl 指向 /capi）。
    # 独立反代到 cloud 内的客户鉴权 API 8091；必须放在 SPA fallback 之前，避免 /capi/* 被 index.html 吞掉。
    location /capi/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 边缘客户端安装包静态下载（与后台同机；发布时把 dmg/exe rsync 到 /opt/aidcp/downloads/）。
    # 与 isales 隔离：独立 location + 独立目录。前端「下载客户端」按钮指向 /downloads/<file>。
    # alias 末尾斜杠必须保留（/downloads/ 前缀剥离后拼到该目录）。
    location /downloads/ {
        alias /opt/aidcp/downloads/;
        autoindex on;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
